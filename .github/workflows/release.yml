name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the plugin version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          HEADER=$(grep -E '^ \* Version:' anderson-site-shield.php | awk '{print $3}')
          CONST=$(grep -oE "ANSHIELD_VERSION', '[^']+" anderson-site-shield.php | cut -d"'" -f3)
          echo "tag=$TAG header=$HEADER const=$CONST"
          [ "$TAG" = "$HEADER" ] && [ "$TAG" = "$CONST" ]
      - name: Build zip
        run: bash bin/build-zip.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Works whether the tag was pushed or the release was made on GitHub's website.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/anderson-site-shield.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/anderson-site-shield.zip \
              --title "Anderson Site Shield $GITHUB_REF_NAME" --generate-notes
          fi
